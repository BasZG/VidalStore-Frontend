<h2>Crear cuenta</h2>

@if (!esperandoCodigo() && !registroCompleto()) {

  <form (ngSubmit)="registrar()">

    <div>
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
      />
    </div>

    <div>
      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
      />
    </div>

    <button type="submit">
      Registrarse
    </button>

  </form>
}

@if (esperandoCodigo()) {

  <h3>Confirmar cuenta</h3>

  <p>Ingresa el código enviado a {{ email }}</p>

  <form (ngSubmit)="confirmar()">

    <input
      name="codigo"
      type="text"
      [(ngModel)]="codigo"
      required
    />

    <button type="submit">
      Confirmar
    </button>

  </form>
}

@if (mensaje()) {
  <p>{{ mensaje() }}</p>
}

@if (error()) {
  <p>{{ error() }}</p>
}

@if (registroCompleto()) {
  <a routerLink="/">Volver al inicio</a>
}
