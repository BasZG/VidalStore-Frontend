<h1>Catálogo</h1>

<div *ngIf="cargando()">
  Cargando catálogo...
</div>

<div *ngIf="error()">
  {{ error() }}
</div>

<div *ngIf="!cargando() && !error() && juegos().length === 0">
  No hay juegos en el catálogo todavía.
</div>

<div *ngIf="!cargando() && !error() && juegos().length > 0">
  <article *ngFor="let juego of juegos()">
    <h3>{{ juego.titulo }}</h3>

    <img
      *ngIf="juego.imagen"
      [src]="juego.imagen"
      [alt]="juego.titulo"
    />

    <p>{{ juego.descripcion }}</p>
    <p>${{ juego.precio }}</p>

    <button
      type="button"
      [disabled]="compraEnCurso() !== null"
      (click)="comprar(juego)"
    >
      {{
        compraEnCurso() === juego.id
          ? 'Comprando...'
          : 'Comprar'
      }}
    </button>
  </article>
</div>

<div *ngIf="mensajeCompra()">
  {{ mensajeCompra() }}
</div>

<div *ngIf="errorCompra()">
  {{ errorCompra() }}
</div>
