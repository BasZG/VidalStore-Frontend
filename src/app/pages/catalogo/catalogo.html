<main class="catalogo-page">
  <header class="catalogo-header">
    <p class="catalogo-kicker">VidalStore</p>
    <h1>Catálogo</h1>
    <p>Descubre tu próximo juego.</p>
  </header>

  <p *ngIf="cargando()" class="catalogo-estado">
    Cargando catálogo...
  </p>

  <p *ngIf="error()" class="catalogo-mensaje catalogo-error">
    {{ error() }}
  </p>

  <p
    *ngIf="advertenciaBiblioteca()"
    class="catalogo-mensaje catalogo-advertencia"
  >
    {{ advertenciaBiblioteca() }}
  </p>

  <p
    *ngIf="mensajeCompra()"
    class="catalogo-mensaje catalogo-exito"
  >
    {{ mensajeCompra() }}
  </p>

  <p
    *ngIf="errorCompra()"
    class="catalogo-mensaje catalogo-error"
  >
    {{ errorCompra() }}
  </p>

  <p
    *ngIf="!cargando() && !error() && juegos().length === 0"
    class="catalogo-estado"
  >
    No hay juegos en el catálogo todavía.
  </p>

  <section
    *ngIf="!cargando() && !error() && juegos().length > 0"
    class="catalogo-grid"
    aria-label="Juegos disponibles"
  >
    <app-game-card
      *ngFor="let juego of juegos()"
      [titulo]="juego.titulo"
      [descripcion]="juego.descripcion"
      [imagen]="juego.imagen"
      [precio]="juego.precio"
      [genero]="juego.genero ?? null"
      [fechaPublicacion]="juego.fechaPublicacion ?? null"
      [etiqueta]="estaComprado(juego.id) ? 'En tu biblioteca' : null"
      [accionTexto]="textoAccion(juego.id)"
      [accionDeshabilitada]="accionDeshabilitada(juego.id)"
      (accion)="comprar(juego)"
    />
  </section>
</main>
