<h1>VidalStore</h1>

@if (usuario()) {
  <p>Sesión iniciada: {{ usuario() }}</p>

  <button type="button" (click)="cerrarSesion()">
    Cerrar sesión
  </button>
} @else {
  <p>No hay una sesión iniciada.</p>

  <button type="button" (click)="iniciarSesion()">
    Iniciar sesión
  </button>

  <a routerLink="/registro">
    Crear cuenta
  </a>
}

<router-outlet />
