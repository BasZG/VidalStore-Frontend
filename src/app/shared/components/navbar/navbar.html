<nav class="navbar">
  <a class="marca" routerLink="/">
    VidalStore
  </a>

  <div class="navegacion">
    <a routerLink="/catalogo" routerLinkActive="activo">
      Catálogo
    </a>

    <a routerLink="/biblioteca" routerLinkActive="activo">
      Biblioteca
    </a>

    <a routerLink="/editor" routerLinkActive="activo">
      Editor
    </a>

    <a routerLink="/administracion" routerLinkActive="activo">
      Administración
    </a>

    @if (usuario()) {
      <div class="usuario">
        <button
          type="button"
          class="usuario-boton"
          (click)="alternarMenu()"
        >
          {{ nombre() || email() || usuario() }}
        </button>

        @if (menuAbierto()) {
          <div class="usuario-menu">
            <p>
              <strong>Nombre:</strong>
              {{ nombre() || 'No registrado' }}
            </p>

            <p>
              <strong>Correo:</strong>
              {{ email() || usuario() }}
            </p>

            <button type="button" (click)="cerrarSesion()">
              Cerrar sesión
            </button>
          </div>
        }
      </div>
    } @else {
      <button
        type="button"
        class="login"
        (click)="iniciarSesion()"
      >
        Iniciar sesión
      </button>
    }
  </div>
</nav>
